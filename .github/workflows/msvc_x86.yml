name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: choice
        required: false
        default: 'false'
        options:
          - 'true'
          - 'false'
      version_increment:
        description: "Default semantic version release type"
        type: choice
        required: false
        default: 'minor'
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  VERINC: ${{ github.event.inputs.version_increment || 'patch' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@main

    - name: Auto Increment Version
      uses: MCKanpolat/auto-semver-action@1.0.12
      id: versioning
      with:
        releaseType: ${{ env.VERINC }}
        incrementPerCommit: false
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure build
      run: ./premake5 vs2026 --with-version=${{ steps.versioning.outputs.version }}

    - name: Build
      run: |
        msbuild -m build/III.VC.SA.WindowedMode.slnx /property:Configuration=Release /property:Platform=Win32

    - name: Pack binaries
      run: |
        ./data/release.bat
      env:
        CODE_SIGNING_PFX: ${{ github.repository == 'ThirteenAG/III.VC.SA.WindowedMode' && github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PFX || '' }}
        CODE_SIGNING_PASSWORD: ${{ github.repository == 'ThirteenAG/III.VC.SA.WindowedMode' && github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PASSWORD || '' }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/III.VC.SA.WindowedMode.zip

    - name: Upload artifact (asi)
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: data/III.VC.SA.WindowedMode.asi

    - name: Upload Release
      if: |
        github.event.inputs.release == 'true' &&
        github.ref_name == 'master' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'ThirteenAG/III.VC.SA.WindowedMode'
      uses: ncipollo/release-action@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: false
        name: III.VC.SA.WindowedMode v${{ steps.versioning.outputs.version }}
        body: "[README](https://github.com/ThirteenAG/III.VC.SA.WindowedMode#readme)"
        tag: v${{ steps.versioning.outputs.version }}
        artifacts: data/III.VC.SA.WindowedMode.zip
