[MAIN]
; 1: bordered window, 2: borderless window, 3: desktop borderless fullscreen.
WindowMode = 1
; Window style restored by Alt+Enter. Ctrl+Enter switches between 1 and 2.
WindowedStyle = 1
; Pause on loss of focus; resume on activation if this plugin paused the game.
AutoPause = 1
AutoResume = 1

[WINDOW]
; Window geometry is updated automatically. Resolution is the client area.
ResolutionX = 640
ResolutionY = 448
; -1: center on the monitor.
PositionX = -1
PositionY = -1
Maximized = 0
